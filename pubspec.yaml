name: seeruta
description: "SeeRuta - Cebu City jeepney route planner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^14.1.1
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  flutter_compass: ^0.8.1
  vector_map_tiles: ^8.0.0
  vector_tile_renderer: ^5.2.0
  mbtiles: ^0.4.2
  http: ^1.2.0
  sqlite3_flutter_libs: ^0.5.41
  maplibre_gl: ^0.27.1
  sqlite3: ^2.9.4
  google_mlkit_text_recognition: ^1.0.3
  camera: ^0.12.2
  flutter_onnxruntime: ^1.9.0
  shared_preferences: ^2.5.0
  whisper_ggml: ^2.10.0
  record: ^7.0.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/maps/cebu_city.mbtiles
    - assets/maps/barangays.geojson
    - assets/data/routes.db
    - assets/data/cebu_routes_full.json
    - assets/data/cebu_route_landmarks.json
    - assets/models/
    - assets/models/whisper/ggml-tiny-q5_1.bin
    - assets/glyphs/NotoSansRegular/
    - assets/glyphs/NotoSansMedium/
    - assets/glyphs/NotoSansItalic/
    - assets/icon/ruta-icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/ruta-icon.png"
  min_sdk_android: 21