name: myapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^14.1.1
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  flutter_compass: ^0.8.1
  vector_map_tiles: ^8.0.0
  vector_tile_renderer: ^5.2.0
  mbtiles: ^0.4.2
  http: ^1.2.0
  sqlite3_flutter_libs: ^0.5.41
  maplibre_gl: ^0.27.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/cebu_city.mbtiles
    - assets/maps/cebu_city.mbtiles
    - assets/glyphs/NotoSansRegular/
    - assets/glyphs/NotoSansMedium/
    - assets/glyphs/NotoSansItalic/
